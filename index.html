<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">
  <main class="max-w-xl mx-auto px-4 py-6 sm:py-10">

    <!-- Header -->
    <header class="mb-5">
      <h1 class="text-2xl font-extrabold tracking-tight">Expense Tracker</h1>
      <p class="text-sm text-slate-500">Apna kharcha, apne control mein.</p>
    </header>

    <!-- Balance card -->
    <section class="bg-indigo-700 text-white rounded-3xl p-6 shadow-lg shadow-indigo-900/20">
      <p class="text-indigo-200 text-sm">Your balance</p>
      <p id="balance" class="text-4xl sm:text-5xl font-extrabold mt-1">₹0</p>

      <div class="grid grid-cols-2 gap-3 mt-6">
        <div class="bg-white/10 rounded-2xl p-3 flex items-center gap-3">
          <span class="w-9 h-9 rounded-full bg-emerald-400/20 text-emerald-300 flex items-center justify-center font-bold">↓</span>
          <div>
            <p class="text-indigo-200 text-xs">Income</p>
            <p id="income" class="text-lg font-bold text-emerald-300">₹0</p>
          </div>
        </div>
        <div class="bg-white/10 rounded-2xl p-3 flex items-center gap-3">
          <span class="w-9 h-9 rounded-full bg-rose-400/20 text-rose-300 flex items-center justify-center font-bold">↑</span>
          <div>
            <p class="text-indigo-200 text-xs">Spent</p>
            <p id="expense" class="text-lg font-bold text-rose-300">₹0</p>
          </div>
        </div>
      </div>
    </section>

        <!-- Add transaction form -->
    <form id="tx-form" class="bg-white rounded-3xl p-5 mt-5 shadow-sm space-y-3">
      <h2 class="font-bold text-lg">Add transaction</h2>

      <!-- Expense / Income toggle -->
      <div id="type-toggle" class="grid grid-cols-2 gap-1 bg-slate-100 rounded-xl p-1">
        <button type="button" data-type="expense" class="type-btn rounded-lg py-2 text-sm font-semibold">Expense</button>
        <button type="button" data-type="income" class="type-btn rounded-lg py-2 text-sm font-semibold">Income</button>
      </div>

      <!-- Title -->
      <input id="title" type="text" placeholder="What was it for? (e.g. Books)"
        class="w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />

      <!-- Amount + Date -->
      <div class="grid grid-cols-2 gap-3">
        <input id="amount" type="number" min="1" placeholder="Amount (₹)"
          class="rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input id="date" type="date"
          class="rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <!-- Category -->
      <select id="category"
        class="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option>Food</option>
        <option>Travel</option>
        <option>Study</option>
        <option>Bills</option>
        <option>Salary</option>
        <option>Other</option>
      </select>

      <!-- Error message (hidden by default) -->
      <p id="error" class="text-sm text-rose-600 hidden"></p>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-indigo-700 hover:bg-indigo-800 active:scale-[.99] text-white rounded-xl py-3 font-bold focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Add transaction
      </button>
    </form>
        <!-- Transactions list -->
    <section class="mt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">Transactions</h2>

        <!-- Filter buttons -->
        <div id="filters" class="flex bg-white rounded-xl p-1 shadow-sm text-sm">
          <button data-filter="all" class="filter-btn px-3 py-1 rounded-lg font-semibold">All</button>
          <button data-filter="income" class="filter-btn px-3 py-1 rounded-lg font-semibold">Income</button>
          <button data-filter="expense" class="filter-btn px-3 py-1 rounded-lg font-semibold">Spent</button>
        </div>
      </div>

      <!-- JavaScript will fill this list -->
      <ul id="list" class="space-y-2"></ul>
    </section>

  </main>
    <script src="script.js"></script>
</body>
</html>
